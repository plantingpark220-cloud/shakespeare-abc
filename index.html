<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>莎士比亞詞彙 A–Z</title>
<style>
:root{--night:#151a33;--paper:#ebe8e3;--ink:#1b1d2b;--gold:#c29b4b;--wine:#8c2a3a;--mute:#5f6070;
--serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Noto Serif TC","Songti TC","PMingLiU",serif}
*{box-sizing:border-box}
body{margin:0;background:var(--night);color:var(--paper);font-family:var(--serif);min-height:100vh}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 40px}
h1{margin:0 0 14px;font-size:1.05rem;font-weight:400;font-style:italic;color:var(--gold);text-align:center}
.nav{display:grid;grid-template-columns:repeat(13,1fr);gap:4px;margin-bottom:18px}
.nav button{font:inherit;padding:0;min-height:36px;background:transparent;color:var(--paper);border:1px solid #3a4066;border-radius:3px;cursor:pointer}
.nav button:hover{border-color:var(--gold)}
.nav button[aria-current=true]{background:var(--gold);color:var(--night);border-color:var(--gold)}
.card{display:grid;grid-template-columns:minmax(220px,300px) 1fr;background:var(--paper);color:var(--ink);border-radius:4px;overflow:hidden}
.left{background:var(--wine);color:var(--paper);padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.big{font-size:clamp(6rem,22vw,10rem);line-height:.9;font-style:italic;color:var(--gold)}
.icon{width:120px;height:120px;stroke:var(--paper);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.icon .f{fill:var(--gold);stroke:var(--gold)}
.right{padding:26px 28px}
.word{margin:0;font-size:clamp(2rem,6vw,3rem);line-height:1.1}
.ipa{margin:6px 0 0;color:var(--mute);font-size:1.1rem}
.zh{margin:2px 0 14px;color:var(--wine);font-size:1.15rem}
blockquote{margin:16px 0 0;padding:4px 0 4px 16px;border-left:3px solid var(--gold);font-size:1.25rem;line-height:1.5;font-style:italic}
.qz{margin:8px 0 0;font-size:1rem;font-style:normal;color:var(--ink)}
.src{margin:8px 0 0;font-size:.92rem;color:var(--mute)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.btns button{font:inherit;font-size:1rem;padding:10px 16px;min-height:44px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:3px;cursor:pointer}
.btns .go{background:var(--ink);color:var(--paper)}
.btns button:disabled{opacity:.35;cursor:not-allowed}
.btns button:hover:not(:disabled){background:var(--gold);border-color:var(--gold);color:var(--ink)}
button:focus-visible{outline:3px solid var(--wine);outline-offset:2px}
.fact{margin:16px 0 0;padding:12px 14px;background:#ddd8d0;border-radius:3px;font-size:.95rem;line-height:1.6}
.fact b{color:var(--wine)}
.msg{min-height:1.3em;margin:10px 0 0;font-size:.9rem;color:var(--wine)}
.note{margin:16px 4px 0;font-size:.85rem;color:#9ba0bd;text-align:center}
@media(max-width:640px){.card{grid-template-columns:1fr}.left{flex-direction:row;padding:16px}.icon{width:84px;height:84px}.big{font-size:5.5rem}.nav{grid-template-columns:repeat(9,1fr)}}
</style>
</head>
<body>
<main class="wrap">
<h1>Shakespeare from A to Z</h1>
<nav class="nav" id="nav" aria-label="選擇字母"></nav>
<section class="card">
  <div class="left"><div class="big" id="big">A</div><svg class="icon" id="icon" viewBox="0 0 64 64" aria-hidden="true"></svg></div>
  <div class="right">
    <h2 class="word" id="word"></h2>
    <p class="ipa" id="ipa"></p>
    <p class="zh" id="zh"></p>
    <blockquote><span id="q"></span><p class="qz" id="qz"></p><p class="src" id="src"></p></blockquote>
    <p class="fact"><b>小知識</b>　<span id="fact"></span></p>
    <div class="btns">
      <button class="go" id="pw">聽單字</button>
      <button id="pq">聽金句</button>
      <button id="prev">上一個</button>
      <button id="next">下一個</button>
    </div>
    <p class="msg" id="msg" role="status"></p>
  </div>
</section>
<p class="note">金句依常見版本收錄，小知識為簡要說明，不同版本的標點與拼字略有差異。發音使用瀏覽器內建的英式英語語音。</p>
</main>
<script>

{w:"exits",i:"/ˈɛɡ.zɪts/",z:"退場",q:"All the world's a stage, And all the men and women merely players; They have their exits and their entrances.",t:"全世界是一座舞台，男男女女不過是演員；他們有退場，也有登場。",s:"《皆大歡喜》2.7",f:"出自傑克斯（Jaques）的「人生七個階段」演說，把人生比作一齣戲。",c:'<path d="M16 58V8h32v50M10 58h44"/><circle cx="40" cy="34" r="2"/>'},
{w:"foul",i:"/faʊl/",z:"污穢、邪惡",q:"Fair is foul, and foul is fair: Hover through the fog and filthy air.",t:"美即是醜，醜即是美：飛過濃霧與污濁的空氣。",s:"《馬克白》1.1",f:"三女巫為全劇開場，一句話就把善惡顛倒；馬克白第一次登場時，說的也是「如此污穢又美好的一天」。",c:'<path d="M10 22h34M18 32h36M10 42h34M18 52h30"/>'},
{w:"grave",i:"/ɡreɪv/",z:"墳墓；嚴肅",q:"Ask for me tomorrow, and you shall find me a grave man.",t:"明天來找我，你會發現我成了個「墳墓裡的人」。（grave 兼有「嚴肅」的雙關）",s:"《羅密歐與茱麗葉》3.1",f:"墨枯修（Mercutio）中劍將死時說的雙關玩笑：grave 既是墳墓，也是嚴肅。",c:'<path d="M16 58V26a16 16 0 0132 0v32zM10 58h44M32 24v16M26 30h12"/>'},
{w:"hurlyburly",i:"/ˌhɜː.liˈbɜː.li/",z:"喧囂騷亂",q:"When the hurlyburly's done, When the battle's lost and won.",t:"當喧囂平息，當戰事有輸有贏。",s:"《馬克白》1.1",f:"三女巫在全劇開場約定下次見面時說的，hurlyburly 指戰爭的喧囂混亂。",c:'<path d="M12 12l36 36M52 12L16 48M10 54l8-8M54 54l-8-8"/>'},
{w:"insubstantial",i:"/ˌɪn.səbˈstæn.ʃəl/",z:"虛幻無實的",q:"And, like this insubstantial pageant faded, Leave not a rack behind.",t:"如同這虛幻的盛會消散，不留一縷雲絮。",s:"《暴風雨》4.1",f:"rack 指飄散的薄雲。這段是普洛斯彼羅的獨白，常被當作莎士比亞對舞台與人生的告別。",c:'<path stroke-dasharray="3 4" d="M18 40a10 10 0 010-20 14 14 0 0126-2 10 10 0 013 22z"/>'},
{w:"jealousy",i:"/ˈdʒɛl.ə.si/",z:"嫉妒",q:"O, beware, my lord, of jealousy; It is the green-eyed monster which doth mock The meat it feeds on.",t:"大人，當心嫉妒；那是綠眼睛的怪物，會戲弄它所吞食的肉。",s:"《奧賽羅》3.3",f:"說這句話的是伊阿古（Iago），他一邊警告，一邊把嫉妒的種子種進奧賽羅心裡。",c:'<path d="M4 32C14 16 50 16 60 32 50 48 14 48 4 32z"/><circle class="f" cx="32" cy="32" r="8"/>'},
{w:"knell",i:"/nɛl/",z:"喪鐘",q:"Hear it not, Duncan; for it is a knell That summons thee to heaven or to hell.",t:"別聽見它，鄧肯；那是召喚你上天堂或下地獄的喪鐘。",s:"《馬克白》2.1",f:"knell 是為死者敲的鐘聲。馬克白說這句話時，正走向鄧肯的寢室。",c:'<path d="M16 46c4-4 4-10 4-18a12 12 0 0124 0c0 8 0 14 4 18zM12 46h40"/><circle class="f" cx="32" cy="54" r="3"/>'},
{w:"lunatic",i:"/ˈluː.nə.tɪk/",z:"瘋子",q:"The lunatic, the lover, and the poet Are of imagination all compact.",t:"瘋子、情人與詩人，全都是想像力的產物。",s:"《仲夏夜之夢》5.1",f:"忒修斯公爵說的，他認為瘋子、情人與詩人都被想像力牽著走。",c:'<path d="M42 8A24 24 0 1042 56 20 20 0 0142 8z"/>'},
{w:"mercy",i:"/ˈmɜː.si/",z:"慈悲",q:"The quality of mercy is not strained; It droppeth as the gentle rain from heaven.",t:"慈悲不是勉強來的；它如甘霖，自天而降。",s:"《威尼斯商人》4.1",f:"波西亞女扮男裝成律師，在法庭上用這段話勸夏洛克寬恕。",c:'<path d="M18 36a10 10 0 010-20 14 14 0 0126-2 10 10 0 013 22zM20 44v6M32 44v10M44 44v6"/>'},
{w:"nothing",i:"/ˈnʌθ.ɪŋ/",z:"虛無",q:"Nothing will come of nothing: speak again.",t:"無中不能生有；再說一次。",s:"《李爾王》1.1",f:"李爾要女兒們說出多愛他，小女兒蔻蒂莉亞答「Nothing」，李爾便回了這句話，悲劇由此展開。",c:'<circle cx="32" cy="32" r="22" stroke-dasharray="3 5"/>'},
{w:"oblivion",i:"/əˈblɪv.i.ən/",z:"遺忘",q:"Is second childishness and mere oblivion, Sans teeth, sans eyes, sans taste, sans everything.",t:"是第二次的童年，全然的遺忘，沒牙、沒眼、沒味覺，什麼都沒有。",s:"《皆大歡喜》2.7",f:"這是「人生七個階段」的最後一幕。sans 是借自法語的「沒有」。",c:'<path d="M16 8h32M16 56h32M18 8c0 16 14 16 14 24S18 40 18 56M46 8c0 16-14 16-14 24s14 8 14 24"/>'},

{w:"quintessence",i:"/kwɪnˈtɛs.əns/",z:"精華、典型",q:"And yet, to me, what is this quintessence of dust?",t:"然而對我來說，這塵土的精華又算什麼？",s:"《哈姆雷特》2.2",f:"字面是「第五元素」，中世紀認為它是構成天體的純粹物質，後來引申為精華。",c:'<path d="M8 54h48"/><circle class="f" cx="18" cy="46" r="2"/><circle class="f" cx="28" cy="40" r="2"/><circle class="f" cx="38" cy="46" r="2"/><circle class="f" cx="46" cy="36" r="2"/><circle class="f" cx="32" cy="26" r="2"/><circle class="f" cx="24" cy="14" r="1.5"/><circle class="f" cx="40" cy="12" r="1.5"/>'},
{w:"rosemary",i:"/ˈrəʊz.mər.i/",z:"迷迭香",q:"There's rosemary, that's for remembrance; pray, love, remember.",t:"這是迷迭香，代表回憶；請你，愛人，記得。",s:"《哈姆雷特》4.5",f:"奧菲莉亞發瘋後分送花草，每一種花都有象徵意義，迷迭香代表回憶。",c:'<path d="M32 58V8M32 20l-10-6M32 20l10-6M32 32l-12-6M32 32l12-6M32 44l-12-6M32 44l12-6"/>'},
{w:"sorrow",i:"/ˈsɒr.əʊ/",z:"悲傷",q:"Parting is such sweet sorrow, That I shall say good night till it be morrow.",t:"離別是如此甜蜜的悲傷，我要說晚安直到天明。",s:"《羅密歐與茱麗葉》2.2",f:"「甜蜜的悲傷」是矛盾修辭（oxymoron）：把兩個互相衝突的詞放在一起。",c:'<path class="f" d="M32 6C20 24 14 32 14 40a18 18 0 0036 0c0-8-6-16-18-34z"/>'},
{w:"tomorrow",i:"/təˈmɒr.əʊ/",z:"明天",q:"Tomorrow, and tomorrow, and tomorrow, Creeps in this petty pace from day to day.",t:"明天，又一個明天，再一個明天，以瑣碎的步子一天天爬行。",s:"《馬克白》5.5",f:"馬克白聽到妻子死訊後說的獨白，接著他說人生不過是「行走的影子」。",c:'<path d="M6 46h52M16 46a16 16 0 0132 0M32 14v8M12 24l5 5M52 24l-5 5"/>'},
{w:"uneasy",i:"/ʌnˈiː.zi/",z:"不安的",q:"Uneasy lies the head that wears a crown.",t:"戴王冠的頭，總是睡不安穩。",s:"《亨利四世（下）》3.1",f:"亨利四世在深夜失眠時說的，感嘆王位的重擔。",c:'<path d="M8 52V14M8 40h48v12M56 52V40M8 40v-8h20a6 6 0 016 8"/>'},
{w:"valiant",i:"/ˈvæl.i.ənt/",z:"勇敢的",q:"Cowards die many times before their deaths; The valiant never taste of death but once.",t:"懦夫在死前已死過多次；勇者只嘗一次死亡的滋味。",s:"《凱撒大帝》2.2",f:"凱撒在遇刺當天，面對妻子勸他別出門時說的。",c:'<path d="M32 6l20 8v16c0 14-8 22-20 28C20 52 12 44 12 30V14z"/><path d="M32 16v34M20 28h24"/>'},

var n=0,$=function(i){return document.getElementById(i)};
function stop(){if(window.speechSynthesis)speechSynthesis.cancel()}
function say(t,r){
  var m=$("msg");m.textContent="";
  if(!window.speechSynthesis){m.textContent="這個瀏覽器不支援語音播放，請改用 Chrome、Edge 或 Safari。";return}
  stop();
  var u=new SpeechSynthesisUtterance(t);u.lang="en-GB";u.rate=r;
  var v=speechSynthesis.getVoices().filter(function(x){return x.lang.replace("_","-")==="en-GB"})[0];
  if(v)u.voice=v;
  u.onerror=function(){m.textContent="語音播放失敗，請稍後再試。"};
  speechSynthesis.speak(u);
}
function show(i){
  if(i<0||i>=D.length)return;
  stop();n=i;var d=D[i];
  $("big").textContent=d.w.charAt(0).toUpperCase();
  $("icon").innerHTML=d.c;
  $("word").textContent=d.w;$("ipa").textContent=d.i;$("zh").textContent=d.z;
  $("q").textContent="“"+d.q+"”";$("qz").textContent=d.t;$("src").textContent="— "+d.s;$("fact").textContent=d.f;
  $("msg").textContent="";
  $("prev").disabled=i===0;$("next").disabled=i===D.length-1;
  var b=$("nav").children;
  for(var k=0;k<b.length;k++){if(k===i)b[k].setAttribute("aria-current","true");else b[k].removeAttribute("aria-current")}
}
D.forEach(function(d,i){var b=document.createElement("button");b.type="button";b.textContent=d.w.charAt(0).toUpperCase();b.setAttribute("aria-label",b.textContent+" "+d.w);b.onclick=function(){show(i)};$("nav").appendChild(b)});
$("pw").onclick=function(){say(D[n].w,.8)};
$("pq").onclick=function(){say(D[n].q,.85)};
$("prev").onclick=function(){show(n-1)};
$("next").onclick=function(){show(n+1)};
document.addEventListener("keydown",function(e){if(e.key==="ArrowLeft")show(n-1);if(e.key==="ArrowRight")show(n+1)});
if(window.speechSynthesis)speechSynthesis.getVoices();
show(0);
</script>
</body>
</html>
